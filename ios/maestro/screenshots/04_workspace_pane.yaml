appId: com.enchantinglabs.herdrcat
---
# Frame 04: Workspace pane — focused pane output and Live composer.
- launchApp:
    clearState: true
    arguments:
      hc.autoconnect: "1"
      hc.host: "127.0.0.1"
      hc.port: "@HC_SSH_PORT@"
      hc.user: "@HC_SSH_USER@"
      hc.key: "@HC_SSH_KEY_PATH@"
      hc.tab: "spaces"

- extendedWaitUntil:
    visible: "Verify Host Key"
    timeout: 30000
- tapOn: "Trust and Connect"

- extendedWaitUntil:
    visible:
      id: "machine-picker"
    timeout: 45000

- extendedWaitUntil:
    visible:
      id: "space-row-1"
    timeout: 45000

- tapOn:
    id: "space-row-1"

- extendedWaitUntil:
    visible:
      id: "pane-live-key-esc"
    timeout: 45000

- waitForAnimationToEnd:
    timeout: 3000
- waitForAnimationToEnd:
    timeout: 3000

- takeScreenshot: "04_workspace_pane"
