name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS
    runs-on: macos-26
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Check attachment storage
        run: python3 ios/HerdcatsTests/test_attachment_storage.py

      - name: Check release preparation
        run: python3 ios/HerdcatsTests/test_release_preparation.py

      - name: Select an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          xcodebuild -version
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - "$RUNNER_TEMP/simulators.json" <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          import sys

          with open(sys.argv[1]) as source:
              devices = json.load(source)["devices"]
          runtimes = sorted(
              (name for name in devices if ".iOS-" in name),
              key=lambda name: tuple(map(int, re.findall(r"\d+", name.rsplit("iOS-", 1)[-1]))),
              reverse=True,
          )
          candidates = [
              device for runtime in runtimes for device in devices[runtime]
              if device.get("isAvailable") and device["name"].startswith("iPhone")
          ]
          if not candidates:
              raise SystemExit("No available iPhone simulator on this runner")
          print("id=" + candidates[0]["udid"])
          PY

      - name: Build and run unit tests
        run: |
          xcodebuild -project ios/Herdcats.xcodeproj -scheme Herdcats \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -destination-timeout 120 \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            test -only-testing:HerdcatsTests \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=-

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test server
        run: node --test test/server.test.js

      - name: Build static website
        run: npm run build
